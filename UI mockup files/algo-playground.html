<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algo-Visualizer — Real-World Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0A0A0B; --surface:#121214; --surface-2:#18181B; --surface-3:#1F1F23;
    --border:#26262A; --border-strong:#3A3A40;
    --text:#E4E4E7; --text-secondary:#8C8C94; --text-muted:#57575E;
    --accent:#5C7CFA; --accent-dim:#171B2E; --accent-soft:#8FA6FA;
    --compare:#A6A9B4; --compare-dim:#1D1E22;
    --swap:#D97757; --swap-dim:#2A1C15; --swap-soft:#E39A7F;
    --done:#5FA88A; --done-dim:#132420;
    --warn:#E0B84B; --warn-dim:#2A2312;
    --sans:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button,select,input{font-family:var(--sans);cursor:pointer;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;} ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px;color:#fff;}
  .brand .name{font-weight:600;font-size:14px;}
  .brand .name span{color:var(--text-muted);font-weight:400;}
  .graph-note{font-size:12px;color:var(--text-muted);}
  .graph-note strong{color:var(--accent-soft);}

  .layout{display:flex;flex:1;min-height:0;}
  .sidebar{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:12px 8px;}
  .side-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:var(--text-secondary);padding:10px 12px;border-radius:8px;font-size:13.5px;text-align:left;margin-bottom:2px;}
  .side-item:hover{background:var(--surface-2);color:var(--text);}
  .side-item.active{background:var(--accent-dim);color:var(--accent-soft);font-weight:500;}
  .side-item .icn{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
  .side-item .cat{font-size:10.5px;color:var(--text-muted);display:block;}
  .side-item.active .cat{color:var(--accent-soft);opacity:.7;}
  .side-item .txtwrap{display:flex;flex-direction:column;gap:1px;}
  .side-divider{padding:14px 12px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;}
  .side-link{display:block;margin:4px 8px 10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--border-strong);font-size:12px;color:var(--text-secondary);}

  .stage{flex:1;overflow-y:auto;padding:22px 30px 40px;}
  .stage-inner{max-width:980px;margin:0 auto;}

  .head{margin-bottom:16px;}
  .crumb{font-size:12px;color:var(--text-muted);font-family:var(--mono);margin-bottom:8px;}
  .title-row{display:flex;align-items:flex-start;gap:14px;}
  .big-icn{font-size:28px;width:50px;height:50px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;}
  h1{font-size:20px;font-weight:600;margin-bottom:3px;}
  .sub{font-size:13px;color:var(--text-secondary);}
  .blurb{margin-top:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;font-size:13px;color:var(--text-secondary);line-height:1.6;}
  .blurb strong{color:var(--text);}

  .card{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap;}
  .ctl-btn{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);height:30px;border-radius:7px;font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:0 12px;gap:6px;}
  .ctl-btn:hover{border-color:var(--accent);color:var(--accent-soft);}
  .ctl-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ctl-btn.primary:hover{background:var(--accent-soft);color:#0A0A0B;}
  select{background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-size:12.5px;}
  .field-label{font-size:11px;color:var(--text-muted);}
  .spacer{flex:1;}
  input[type=range]{width:80px;accent-color:var(--accent);}
  input[type=text],input[type=number]{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12.5px;width:70px;}

  .canvas-body{min-height:230px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 1px 1px,var(--border) 1px,transparent 0) 0 0/22px 22px;}
  .status-line{font-family:var(--mono);font-size:12px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);padding:6px 12px;border-radius:6px;min-height:30px;display:flex;align-items:center;gap:8px;text-align:center;}
  .status-line .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}

  .irl{margin-top:16px;} .irl h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:8px;font-weight:600;}
  .irl-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .irl-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--border);padding:6px 11px;border-radius:20px;}

  /* boxes (sort) */
  .row-flex{display:flex;align-items:flex-end;gap:8px;height:170px;}
  .box{width:46px;border-radius:5px 5px 3px 3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;background:var(--surface-3);border:1.5px solid var(--border-strong);transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;}
  .box .lbl{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text-secondary);}
  .box .tag{position:absolute;top:-20px;font-size:15px;}
  .box.compare{background:var(--compare-dim);border-color:var(--compare);} .box.compare .lbl{color:var(--compare);}
  .box.swap{background:var(--swap-dim);border-color:var(--swap);transform:translateY(-6px);} .box.swap .lbl{color:var(--swap-soft);}
  .box.done{background:var(--done-dim);border-color:var(--done);} .box.done .lbl{color:var(--done);}
  .box.current{background:var(--warn-dim);border-color:var(--warn);} .box.current .lbl{color:var(--warn);}

  /* pages (search) */
  .search-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:680px;}
  .page{width:60px;height:60px;border-radius:8px;background:var(--surface-3);border:1.5px solid var(--border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:all .25s ease;opacity:.35;}
  .page.active-range{opacity:1;} .page .word{font-size:11.5px;font-weight:600;} .page .idx{font-family:var(--mono);font-size:9px;color:var(--text-muted);}
  .page.mid{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-dim);} .page.mid .word{color:var(--accent-soft);}
  .page.found{border-color:var(--done);background:var(--done-dim);} .page.found .word{color:var(--done);}
  .page .tag{position:absolute;top:-20px;font-size:15px;}

  /* train */
  .train-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;}
  .car{width:64px;height:50px;border-radius:8px;background:var(--surface-3);border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px;transition:all .3s ease;}
  .car.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent-soft);}
  .car.done{border-color:var(--done);background:var(--done-dim);color:var(--done);}
  .arrow{font-size:16px;color:var(--text-muted);transition:transform .3s ease;} .arrow.flipped{transform:scaleX(-1);color:var(--swap);}

  /* svg tree / heap */
  svg.tree-svg{max-width:100%;}
  .t-node circle{fill:var(--surface-3);stroke:var(--border-strong);stroke-width:2;transition:all .3s ease;}
  .t-node.compare circle{fill:var(--compare-dim);stroke:var(--compare);}
  .t-node.placed circle{fill:var(--done-dim);stroke:var(--done);}
  .t-node.active circle{fill:var(--warn-dim);stroke:var(--warn);}
  .t-node.removed circle{fill:var(--swap-dim);stroke:var(--swap);opacity:.5;}
  .t-node text{fill:var(--text);font-size:12.5px;font-weight:600;text-anchor:middle;}
  .t-edge{stroke:var(--border-strong);stroke-width:2;}

  /* pack (knapsack) */
  .pack-wrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}
  .pack-items{display:flex;flex-direction:column;gap:8px;}
  .pack-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border-strong);background:var(--surface-3);width:210px;transition:all .3s ease;}
  .pack-item .ic{font-size:17px;} .pack-item .meta{display:flex;flex-direction:column;}
  .pack-item .meta .n{font-size:12px;font-weight:500;} .pack-item .meta .m{font-family:var(--mono);font-size:10px;color:var(--text-muted);}
  .pack-item.chosen{border-color:var(--done);background:var(--done-dim);}
  .pack-item.considering{border-color:var(--accent);background:var(--accent-dim);}
  .pack-item.rejected{opacity:.4;}
  .suitcase{width:180px;border:2px dashed var(--border-strong);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:150px;}
  .suitcase .cap{font-family:var(--mono);font-size:11px;color:var(--text-secondary);text-align:center;margin-bottom:4px;}
  .suitcase .bar-bg{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--border);}
  .suitcase .bar-fill{height:100%;background:var(--accent);transition:width .4s ease;}

  /* n-queens board */
  .board{display:inline-grid;gap:2px;background:var(--border);padding:2px;border-radius:8px;border:1px solid var(--border-strong);}
  .sq{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--surface-3);transition:background .2s ease;position:relative;}
  .sq.trying{background:var(--warn-dim);} .sq.conflict{background:var(--swap-dim);} .sq.placed{background:var(--done-dim);}

  /* timeline (greedy) */
  .timeline-wrap{width:100%;max-width:720px;}
  .timeline-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-bottom:4px;padding:0 2px;}
  .tl-row{position:relative;height:34px;margin-bottom:6px;background:var(--surface-2);border-radius:6px;border:1px solid var(--border);}
  .tl-bar{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--surface-3);border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--text-secondary);transition:all .3s ease;overflow:hidden;white-space:nowrap;}
  .tl-bar.considering{border-color:var(--accent);background:var(--accent-dim);color:var(--accent-soft);}
  .tl-bar.chosen{border-color:var(--done);background:var(--done-dim);color:var(--done);}
  .tl-bar.rejected{border-color:var(--swap);background:var(--swap-dim);opacity:.55;color:var(--swap-soft);}

  /* strings */
  .text-wrap{font-family:var(--mono);font-size:16px;line-height:2.2;display:flex;flex-wrap:wrap;justify-content:center;max-width:760px;gap:2px;}
  .ch{padding:2px 1px;border-radius:3px;position:relative;}
  .ch.window{background:var(--surface-2);}
  .ch.match{background:var(--done-dim);color:var(--done);font-weight:600;}
  .ch.mismatch{background:var(--swap-dim);color:var(--swap-soft);font-weight:600;}
  .ch.found{background:var(--done-dim);color:var(--done);font-weight:700;border-bottom:2px solid var(--done);}

  /* sieve grid */
  .num-grid{display:grid;grid-template-columns:repeat(10,38px);gap:4px;}
  .num-cell{width:38px;height:38px;border-radius:6px;background:var(--surface-3);border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text-secondary);transition:all .25s ease;}
  .num-cell.marking{background:var(--swap-dim);border-color:var(--swap);color:var(--swap-soft);}
  .num-cell.composite{background:var(--surface-2);border-color:var(--border);color:var(--text-muted);opacity:.5;}
  .num-cell.prime-candidate{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-soft);}
  .num-cell.prime{background:var(--done-dim);border-color:var(--done);color:var(--done);}

  .stub{padding:26px;text-align:center;color:var(--text-secondary);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="mark">A</div><div class="name">Algo-Visualizer <span>· Real-World Playground</span></div></div>
    <div class="graph-note">Looking for <strong>Graphs</strong>? That's the dedicated Delivery Route Finder shared separately.</div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="stage"><div class="stage-inner" id="stage-inner"></div></main>
  </div>
</div>

<script>
/* ====================== CATEGORY REGISTRY ====================== */
const DEMOS = [
  { key:'sort', cat:'Sorting', icon:'📦', name:'Warehouse Package Sort',
    sub:'Sorting packages by weight before loading a delivery truck',
    blurb:'Two neighbouring packages on the conveyor are compared — lighter ones work their way toward the front of the truck. Switch algorithms below to see genuinely different strategies for the same job: <strong>Bubble</strong> repeatedly swaps neighbours, <strong>Selection</strong> hunts for the lightest remaining package each pass, <strong>Insertion</strong> slots each new package into its correct place among ones already loaded.',
    irl:[['📦','Package loading order'],['🎓','Teaching sorting fundamentals'],['🃏','Sorting a hand of cards (insertion)']] },
  { key:'search', cat:'Searching', icon:'📖', name:'Dictionary Lookup',
    sub:'Finding a word — compare a page-by-page scan against jumping to the middle',
    blurb:'<strong>Linear Search</strong> checks every page from the start — reliable, but slow on a big book. <strong>Binary Search</strong> only works because the dictionary is alphabetised: jump to the middle, eliminate half the remaining pages, repeat. Run both against the same word and compare how many pages each one actually opens.',
    irl:[['📖','Dictionary / phonebook lookup'],['🐛','git bisect for a bad commit'],['🎒','Unsorted bag = linear only']] },
  { key:'list', cat:'Linked Lists', icon:'🚂', name:'Turning a Train Around',
    sub:'Reversing a train one coupling at a time',
    blurb:'Each car only knows the next car in line — it has no idea what\'s further down the track. To reverse the whole train, you walk car by car and flip each coupling to point backward instead of forward, one at a time.',
    irl:[['🚂','Reversing a train\'s direction'],['↩️','Undo/redo history chains']] },
  { key:'tree', cat:'Trees', icon:'🗂️', name:'Filing Cabinet (BST)',
    sub:'Filing documents by reference number, then finding one again',
    blurb:'At every folder, a document\'s number is compared to the one in front of you: smaller goes left, larger goes right. Build the cabinet by filing documents in order, then try searching for one — the search retraces exactly the same left/right logic used to file it.',
    irl:[['🗂️','Filing systems / reference lookups'],['🏪','Product catalog drill-down']] },
  { key:'heap', cat:'Heaps & Priority Queues', icon:'🚑', name:'ER Triage Queue',
    sub:'The most critical patient is always pulled next, regardless of arrival order',
    blurb:'New patients get inserted and "bubble up" toward the top if they\'re more urgent than whoever is above them. Discharging pulls the most urgent patient out, moves the last-arrived patient to the top, then lets them "sink down" until the heap is valid again. Run the full sequence to see admissions build the heap, then watch discharge order fall out in perfect priority order.',
    irl:[['🚑','ER triage ordering'],['🖥️','OS task scheduling'],['🏆','Auction / leaderboard top-N']] },
  { key:'knapsack', cat:'Dynamic Programming', icon:'🧳', name:'Packing a Weight-Limited Suitcase',
    sub:'Choosing which items to bring for maximum value without exceeding the limit',
    blurb:'For every item, the algorithm asks: does bringing it (and bumping something else) beat leaving it out, for every possible amount of remaining space? It builds up the best possible combination for every weight limit along the way, then reconstructs which items actually made the cut.',
    irl:[['🧳','Packing luggage under a weight limit'],['💰','Budget-constrained project selection']] },
  { key:'queens', cat:'Backtracking', icon:'♛', name:'Banquet Seating (N-Queens)',
    sub:'Seating guests so no two share a row, column, or diagonal sightline',
    blurb:'Guests are seated one per row, left to right. The moment a new seat conflicts with someone already seated — same column, or a diagonal line of sight — that seat is rejected and the next one tried. If every seat in a row fails, the algorithm backs up and moves the previous guest, exactly like backing out of a wrong turn.',
    irl:[['♛','Constraint-based seating/scheduling'],['🔢','Sudoku-style constraint solving']] },
  { key:'greedy', cat:'Greedy', icon:'📅', name:'Meeting Room Scheduler',
    sub:'Booking the most meetings into a single room',
    blurb:'Meetings are considered in order of <strong>when they end</strong>, earliest first. A meeting is accepted only if it starts after the last accepted meeting ends. This simple greedy rule — always take whatever frees up the room soonest — providably fits the maximum possible number of non-overlapping meetings.',
    irl:[['📅','Meeting room scheduling'],['🎬','Fitting showtimes into one screen']] },
  { key:'string', cat:'Strings', icon:'🔎', name:'Find in Document',
    sub:'Sliding a search pattern across text, character by character',
    blurb:'The pattern is checked against every possible starting position in the text. At each position, characters are compared left to right until either the whole pattern matches or a mismatch forces the window to slide one step to the right and start over.',
    irl:[['🔎','Ctrl+F / find-in-document'],['🧬','DNA motif searching'],['🎓','Plagiarism scanning']] },
  { key:'sieve', cat:'Math & Bit Manipulation', icon:'🎫', name:'Crossing Out Non-Prime Raffle Numbers',
    sub:'Eliminating every multiple of each number to leave only primes standing',
    blurb:'Starting from 2, every multiple of it gets crossed out. Move to the next number still standing, cross out its multiples too, and keep going. Whatever survives the whole sweep is exactly the set of primes — and you never had to test any number for primality directly.',
    irl:[['🔐','Generating primes for crypto keys'],['🎫','Elimination-style number games']] },
];

let current = null;
let player = { frames:[], idx:0, timer:null, speed:600, render:null };

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = DEMOS.map(d => `
    <button class="side-item" data-key="${d.key}" onclick="selectDemo('${d.key}')">
      <span class="icn">${d.icon}</span>
      <span class="txtwrap"><span>${d.name}</span><span class="cat">${d.cat}</span></span>
    </button>`).join('') + `
    <div class="side-divider">Already shipped</div>
    <div class="side-link">🕸️ <strong style="color:var(--text)">Graphs</strong> — Delivery Route Finder (BFS / Dijkstra / A*) is its own playground, shared previously.</div>
  `;
}

function selectDemo(key){
  current = key;
  document.querySelectorAll('.side-item').forEach(el=>el.classList.toggle('active', el.dataset.key===key));
  const d = DEMOS.find(x=>x.key===key);
  stopPlayer();
  const inner = document.getElementById('stage-inner');
  inner.innerHTML = `
    <div class="head">
      <div class="crumb">${d.cat}</div>
      <div class="title-row">
        <div class="big-icn">${d.icon}</div>
        <div><h1>${d.name}</h1><div class="sub">${d.sub}</div></div>
      </div>
      <div class="blurb">${d.blurb}</div>
    </div>
    <div class="card">
      <div class="toolbar" id="demo-toolbar"></div>
      <div class="canvas-body" id="canvas-body"></div>
    </div>
    <div class="irl"><h3>Also shows up in</h3><div class="irl-chips">${d.irl.map(x=>`<div class="irl-chip"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div></div>
  `;
  INIT[key]();
}

/* ====================== GENERIC PLAYER CONTROLS ====================== */
function playerBar(extra=''){
  return `
    <button class="ctl-btn" onclick="playerStep(-1)">⏮</button>
    <button class="ctl-btn primary" id="play-btn" onclick="playerToggle()">▶ Play</button>
    <button class="ctl-btn" onclick="playerStep(1)">⏭</button>
    <button class="ctl-btn" onclick="playerRestart()">↺ Restart</button>
    <span class="field-label" style="margin-left:6px;">speed</span>
    <input type="range" min="80" max="1100" value="600" oninput="player.speed=1180-Number(this.value); if(player.timer){playerToggle();playerToggle();}">
    <div class="spacer"></div>
    ${extra}
  `;
}
function stopPlayer(){ if(player.timer){clearInterval(player.timer); player.timer=null;} }
function playerRestart(){ stopPlayer(); const btn=document.getElementById('play-btn'); if(btn)btn.textContent='▶ Play'; player.idx=0; if(player.render) player.render(player.frames[0],0); }
function playerStep(dir){ stopPlayer(); const btn=document.getElementById('play-btn'); if(btn)btn.textContent='▶ Play'; player.idx=Math.max(0,Math.min(player.frames.length-1,player.idx+dir)); if(player.render) player.render(player.frames[player.idx],player.idx); }
function playerToggle(){
  const btn=document.getElementById('play-btn');
  if(player.timer){ stopPlayer(); btn.textContent='▶ Play'; return; }
  btn.textContent='⏸ Pause';
  player.timer=setInterval(()=>{
    if(player.idx>=player.frames.length-1){ stopPlayer(); btn.textContent='▶ Play'; return; }

/* ====================== 1. SORTING ====================== */
function sortFrames(values, algo){
  const arr=[...values]; const n=arr.length; const frames=[{arr:[...arr],hi:[],swap:[],done:[]}];
  if(algo==='bubble'){
    const doneIdx=[];
    for(let i=0;i<n;i++){
      for(let j=0;j<n-i-1;j++){
        frames.push({arr:[...arr],hi:[j,j+1],swap:[],done:[...doneIdx]});
        if(arr[j]>arr[j+1]){ [arr[j],arr[j+1]]=[arr[j+1],arr[j]]; frames.push({arr:[...arr],hi:[],swap:[j,j+1],done:[...doneIdx]}); }
      }
      doneIdx.push(n-i-1);
    }
    frames.push({arr:[...arr],hi:[],swap:[],done:[...Array(n).keys()]});
  } else if(algo==='selection'){
    const doneIdx=[];
    for(let i=0;i<n;i++){
      let minIdx=i;
      for(let j=i+1;j<n;j++){
        frames.push({arr:[...arr],hi:[minIdx,j],swap:[],done:[...doneIdx]});
        if(arr[j]<arr[minIdx]) minIdx=j;
      }
      if(minIdx!==i){ [arr[i],arr[minIdx]]=[arr[minIdx],arr[i]]; frames.push({arr:[...arr],hi:[],swap:[i,minIdx],done:[...doneIdx]}); }
      doneIdx.push(i);
    }
    frames.push({arr:[...arr],hi:[],swap:[],done:[...Array(n).keys()]});
  } else { // insertion
    for(let i=1;i<n;i++){
      let key=arr[i], j=i-1;
      frames.push({arr:[...arr],hi:[i],swap:[],done:[],cur:i});
      while(j>=0 && arr[j]>key){
        frames.push({arr:[...arr],hi:[j,j+1],swap:[],done:[],cur:i});
        arr[j+1]=arr[j]; j--;
        frames.push({arr:[...arr],hi:[],swap:[j+1],done:[],cur:i});
      }
      arr[j+1]=key;
      frames.push({arr:[...arr],hi:[],swap:[j+1],done:[],cur:i});
    }
    frames.push({arr:[...arr],hi:[],swap:[],done:[...Array(n).keys()]});
  }
  return frames;
}
function initSort(){
  const toolbar=document.getElementById('demo-toolbar');
  toolbar.innerHTML = `<span class="field-label">Algorithm</span>
    <select id="sort-algo" onchange="runSort()">
      <option value="bubble">Bubble Sort</option>
      <option value="selection">Selection Sort</option>
      <option value="insertion">Insertion Sort</option>
    </select>` + playerBar();
  document.getElementById('canvas-body').innerHTML = `<div class="row-flex" id="sort-row"></div><div class="status-line" id="sort-status"><span class="dot"></span><span id="sort-status-text">Ready</span></div>`;
  runSort();
}
function runSort(){
  const values=[72,34,58,12,90,45,23,66];
  const algo=document.getElementById('sort-algo').value;
  const frames=sortFrames(values, algo);
  const max=Math.max(...values);
  const row=document.getElementById('sort-row');
  const render=(f)=>{
    row.innerHTML=f.arr.map((v,i)=>{
      let cls=''; if(f.done.includes(i))cls='done'; else if(f.swap&&f.swap.includes(i))cls='swap'; else if(f.hi&&f.hi.includes(i))cls='compare'; else if(f.cur===i)cls='current';
      const h=Math.max((v/max)*130,18);
      const tag=cls==='swap'?'🔄':cls==='compare'?'👀':cls==='done'?'✅':cls==='current'?'📦':'';
      return `<div class="box ${cls}" style="height:${h}px"><span class="tag">${tag}</span><span style="font-size:15px">📦</span><span class="lbl">${v}kg</span></div>`;
    }).join('');
    const t=document.getElementById('sort-status-text');
    if(f.swap&&f.swap.length) t.textContent=`Loading package ${f.arr[f.swap[f.swap.length-1]]}kg into position`;
    else if(f.hi&&f.hi.length===2 && f.done.length!==f.arr.length) t.textContent=`Comparing ${f.arr[f.hi[0]]}kg and ${f.arr[f.hi[1]]}kg`;
    else if(f.done.length===f.arr.length) t.textContent='Truck loaded — lightest to heaviest ✅';

function runSearch(){
  const words=['ant','bark','crane','dune','ember','flint','grove','husk','ivory','jolt','kite','lumen','mint','nudge','opal','quartz'];
  const algo=document.getElementById('search-algo').value;
  const targetIdx=Number(document.getElementById('search-target').value);
  const frames=[];
  if(algo==='binary'){
    let lo=0,hi=words.length-1;
    frames.push({lo,hi,mid:-1,found:-1,checks:0});
    let checks=0;
    while(lo<=hi){
      const mid=Math.floor((lo+hi)/2); checks++;
      frames.push({lo,hi,mid,found:-1,checks});
      if(mid===targetIdx){ frames.push({lo,hi,mid,found:mid,checks}); break; }
      else if(words[mid]<words[targetIdx]) lo=mid+1; else hi=mid-1;
      frames.push({lo,hi,mid:-1,found:-1,checks});
    }
  } else {
    for(let i=0;i<words.length;i++){
      frames.push({lo:0,hi:words.length-1,mid:i,found:-1,checks:i+1});
      if(i===targetIdx){ frames.push({lo:0,hi:words.length-1,mid:i,found:i,checks:i+1}); break; }
    }
  }
  const row=document.getElementById('search-row');
  const render=(f)=>{
    row.innerHTML=words.map((w,i)=>{
      const inRange = algo==='binary' ? (i>=f.lo && i<=f.hi) : (i<=f.checks-1 || f.checks===0);
      let cls='page'+(inRange?' active-range':'');
      if(i===f.mid) cls+=' mid'; if(i===f.found) cls+=' found';
      const tag=i===f.mid?'🔍':(i===f.found?'✅':'');
      return `<div class="${cls}"><span class="tag">${tag}</span><span class="word">${w}</span><span class="idx">pg ${i}</span></div>`;
    }).join('');
    const t=document.getElementById('search-status-text');
    if(f.found>=0) t.textContent=`Found "${words[targetIdx]}" after opening ${f.checks} page${f.checks===1?'':'s'}`;
    else if(f.mid>=0) t.textContent=`Opening page ${f.mid}: "${words[f.mid]}" (${f.checks} opened so far)`;
    else t.textContent='Narrowing search…';
  };
  player={frames,idx:0,timer:null,speed:650,render}; render(frames[0]);
}

function initTree(){
  document.getElementById('demo-toolbar').innerHTML = `
    <button class="ctl-btn primary" onclick="buildTreeFrames()">🗂️ Build cabinet (insert all)</button>
    <span class="field-label" style="margin-left:8px;">Search for</span>

  window._treeRoot = null;
  buildTreeFrames();
}
function _cloneTree(node){ if(!node)return null; return {v:node.v,x:node.x,y:node.y,left:_cloneTree(node.left),right:_cloneTree(node.right)}; }
function buildTreeFrames(){
  const insertSeq=[50,30,70,20,40,65,80];
  let root=null; const frames=[];
  function insertVal(val){
    if(root===null){ root={v:val,x:300,y:36,left:null,right:null}; frames.push({tree:_cloneTree(root),comparing:val,at:null,placed:null}); frames.push({tree:_cloneTree(root),comparing:null,at:null,placed:val}); return; }
    let node=root, curX=300, curY=36, spread=150;
    while(true){
      frames.push({tree:_cloneTree(root),comparing:val,at:node.v,placed:null});
      if(val<node.v){
        if(node.left===null){ curX-=spread; curY+=68; node.left={v:val,x:curX,y:curY,left:null,right:null}; frames.push({tree:_cloneTree(root),comparing:null,at:null,placed:val}); break; }
        node=node.left; curX-=spread; curY+=68; spread/=1.7;
      } else {
        if(node.right===null){ curX+=spread; curY+=68; node.right={v:val,x:curX,y:curY,left:null,right:null}; frames.push({tree:_cloneTree(root),comparing:null,at:null,placed:val}); break; }
        node=node.right; curX+=spread; curY+=68; spread/=1.7;
      }
    }
  }
  insertSeq.forEach(insertVal);
  frames.push({tree:_cloneTree(root),comparing:null,at:null,placed:null,final:true});
  window._treeRoot = root;
  renderTreeSeq(frames, 'insert');
}
function searchTreeFrames(){
  const root = window._treeRoot;
  if(!root) return;
  const target = Number(document.getElementById('tree-target').value);
  const frames = [{tree:_cloneTree(root),comparing:null,at:null,placed:null}];
  let node=root, found=false;
  while(node){
    frames.push({tree:_cloneTree(root),comparing:target,at:node.v,placed:null});
    if(target===node.v){ found=true; frames.push({tree:_cloneTree(root),comparing:null,at:null,placed:node.v,foundMsg:true}); break; }
    node = target<node.v ? node.left : node.right;
  }
  if(!found) frames.push({tree:_cloneTree(root),comparing:null,at:null,placed:null,notFound:true});
  renderTreeSeq(frames, 'search', target);
}
function renderTreeSeq(frames, kind, target){
  function drawEdges(node,out){ if(!node)return; if(node.left){out.push(`<line class="t-edge" x1="${node.x}" y1="${node.y}" x2="${node.left.x}" y2="${node.left.y}"/>`); drawEdges(node.left,out);} if(node.right){out.push(`<line class="t-edge" x1="${node.x}" y1="${node.y}" x2="${node.right.x}" y2="${node.right.y}"/>`); drawEdges(node.right,out);} }
  function drawNodes(node,f,out){ if(!node)return; let cls='t-node'; if(f.comparing!==null && f.at===node.v) cls+=' compare'; if(f.placed===node.v) cls+=' placed'; out.push(`<g class="${cls}"><circle cx="${node.x}" cy="${node.y}" r="21"/><text x="${node.x}" y="${node.y+5}">#${node.v}</text></g>`); drawNodes(node.left,f,out); drawNodes(node.right,f,out); }
  const render=(f)=>{
    const eo=[]; drawEdges(f.tree,eo); const no=[]; drawNodes(f.tree,f,no);
    document.getElementById('tree-svg-wrap').innerHTML = `<svg class="tree-svg" viewBox="0 0 600 270" width="100%" height="260">${eo.join('')}${no.join('')}</svg>`;
    const t=document.getElementById('tree-status-text');
    if(kind==='insert'){
      if(f.final) t.textContent='All documents filed ✅';
      else if(f.placed!==null) t.textContent=`Filed document #${f.placed}`;
      else if(f.comparing!==null) t.textContent=`Comparing #${f.comparing} to folder #${f.at}`;
      else t.textContent='ready';
    } else {
      if(f.foundMsg) t.textContent=`Found #${target} ✅`;
      else if(f.notFound) t.textContent=`#${target} isn't filed anywhere — search ends at an empty folder`;
      else if(f.at!==null) t.textContent=`Comparing #${target} to folder #${f.at}`;
      else t.textContent='Starting search at the top folder…';
    }
  };
  player={frames,idx:0,timer:null,speed:750,render}; render(frames[0]);
}

/* ====================== 5. HEAP (ER triage) ====================== */
function heapPos(i, total){
  const depth = Math.floor(Math.log2(i+1));
  const posInLevel = i - (Math.pow(2,depth)-1);
  const levelWidth = Math.pow(2,depth);
  const x = 40 + (620-80) * ((posInLevel+0.5)/levelWidth);
  const y = 34 + depth*62;
  return {x,y};
}
function initHeap(){
  document.getElementById('demo-toolbar').innerHTML = `<button class="ctl-btn primary" onclick="runHeapSequence()">▶ Run full shift (admit then discharge)</button>` + playerBar();
  document.getElementById('canvas-body').innerHTML = `<div id="heap-svg-wrap"></div><div class="status-line" id="heap-status"><span class="dot"></span><span id="heap-status-text">Ready</span></div>`;
  runHeapSequence();
}
function runHeapSequence(){
  const patients = [5,2,8,1,9,3,7]; // lower = more urgent
  let heap = [];
  const frames = [];
  const snap=(extra)=>frames.push(Object.assign({heap:[...heap]}, extra));

  function siftUp(i){
    while(i>0){
      const p=Math.floor((i-1)/2);
      snap({compareA:i,compareB:p});
      if(heap[p] > heap[i]){ [heap[p],heap[i]]=[heap[i],heap[p]]; snap({swapA:i,swapB:p}); i=p; }
      else break;
    }
  }
  function siftDown(i){
    const n=heap.length;
    while(true){
      let l=2*i+1,r=2*i+2,smallest=i;
      if(l<n && heap[l]<heap[smallest]) smallest=l;
      if(r<n && heap[r]<heap[smallest]) smallest=r;
      snap({compareA:i,compareB:smallest});
      if(smallest!==i){ [heap[i],heap[smallest]]=[heap[smallest],heap[i]]; snap({swapA:i,swapB:smallest}); i=smallest; }
      else break;
    }
  }
  patients.forEach(p=>{ heap.push(p); snap({inserted:heap.length-1}); siftUp(heap.length-1); });
  snap({phaseMsg:'admissions-done'});
  const dischargeOrder=[];
  while(heap.length){
    snap({extracting:0});
    dischargeOrder.push(heap[0]);
    const last=heap.pop();
    if(heap.length){ heap[0]=last; snap({heap:[...heap]}); siftDown(0); }
    else snap({heap:[...heap]});
  }
  snap({finalOrder:dischargeOrder});

  const render=(f)=>{
    const h=f.heap;
    let edgeSvg='', nodeSvg='';
    h.forEach((val,i)=>{
      const pos=heapPos(i);
      const parent=Math.floor((i-1)/2);
      if(i>0){ const pp=heapPos(parent); edgeSvg+=`<line class="t-edge" x1="${pp.x}" y1="${pp.y}" x2="${pos.x}" y2="${pos.y}"/>`; }
      let cls='t-node';
      if(f.compareA===i||f.compareB===i) cls+=' compare';
      if(f.swapA===i||f.swapB===i) cls+=' active';
      if(f.inserted===i) cls+=' placed';
      if(f.extracting===i) cls+=' removed';
      nodeSvg+=`<g class="${cls}"><circle cx="${pos.x}" cy="${pos.y}" r="20"/><text x="${pos.x}" y="${pos.y+5}">${val}</text></g>`;
    });
    document.getElementById('heap-svg-wrap').innerHTML = `<svg class="tree-svg" viewBox="0 0 660 260" width="100%" height="250">${edgeSvg}${nodeSvg}</svg>`;
    const t=document.getElementById('heap-status-text');
    if(f.finalOrder) t.textContent = `Discharge order (most urgent first): ${f.finalOrder.join(' → ')} ✅`;
    else if(f.extracting===0) t.textContent = `Discharging most critical patient: severity ${h[0]}`;
    else if(f.swapA!==undefined) t.textContent = `Swapping positions ${f.swapA} and ${f.swapB}`;
    else if(f.compareA!==undefined) t.textContent = `Comparing severity at position ${f.compareA} vs ${f.compareB}`;
    else if(f.inserted!==undefined) t.textContent = `New patient admitted, severity ${h[f.inserted]}`;
    else if(f.phaseMsg) t.textContent = 'All patients admitted — now discharging by priority…';
    else t.textContent='ready';
  };
  player={frames,idx:0,timer:null,speed:550,render}; render(frames[0]);
}

/* ====================== 7. N-QUEENS ====================== */
function initQueens(){
  document.getElementById('demo-toolbar').innerHTML = `<span class="field-label">Table size</span>
    <select id="queens-n" onchange="runQueens()"><option value="5">5×5</option><option value="6" selected>6×6</option><option value="7">7×7</option></select>` + playerBar();
  document.getElementById('canvas-body').innerHTML = `<div class="board" id="board"></div><div class="status-line" id="queens-status"><span class="dot"></span><span id="queens-status-text">Ready</span></div>`;
  runQueens();
}
function runQueens(){
  const n=Number(document.getElementById('queens-n').value);
  const frames=[]; const cols=Array(n).fill(-1); // cols[row] = col of queen
  let solved=false;
  function safe(row,col){ for(let r=0;r<row;r++){ if(cols[r]===col || Math.abs(cols[r]-col)===row-r) return false; } return true; }
  function solve(row){
    if(solved) return;
    if(row===n){ solved=true; frames.push({cols:[...cols],phase:'solved'}); return; }
    for(let c=0;c<n;c++){
      frames.push({cols:[...cols],trying:{row,c},phase:'trying'});
      if(safe(row,c)){
        cols[row]=c; frames.push({cols:[...cols],phase:'placed',placedRow:row});
        solve(row+1);
        if(solved) return;
        cols[row]=-1; frames.push({cols:[...cols],phase:'backtrack',backRow:row});
      } else {
        frames.push({cols:[...cols],trying:{row,c},phase:'conflict'});
      }
    }
  }
  solve(0);
  const board=document.getElementById('board');
  board.style.gridTemplateColumns=`repeat(${n},44px)`;
  const render=(f)=>{
    let html='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      let cls='sq';
      if(f.cols[r]===c) cls+=' placed';
      if(f.trying && f.trying.row===r && f.trying.c===c) cls += f.phase==='conflict' ? ' conflict' : ' trying';
      const content = f.cols[r]===c ? '👤' : '';
      html+=`<div class="${cls}">${content}</div>`;
    }
    board.innerHTML=html;
    const t=document.getElementById('queens-status-text');
    if(f.phase==='solved') t.textContent=`All ${n} guests seated with no shared sightlines ✅`;
    else if(f.phase==='conflict') t.textContent=`Row ${f.trying.row+1}, seat ${f.trying.c+1}: conflicts with someone already seated ❌`;
    else if(f.phase==='trying') t.textContent=`Trying row ${f.trying.row+1}, seat ${f.trying.c+1}…`;
    else if(f.phase==='placed') t.textContent=`Seated row ${f.placedRow+1} — moving to the next row`;
    else if(f.phase==='backtrack') t.textContent=`Dead end — un-seating row ${f.backRow+1} and trying the next option`;
    else t.textContent='ready';
  };
  player={frames,idx:0,timer:null,speed:180,render}; render(frames[0]);
}

/* ====================== 8. GREEDY (activity selection) ====================== */
function initGreedy(){
  document.getElementById('demo-toolbar').innerHTML = playerBar();
  document.getElementById('canvas-body').innerHTML = `<div class="timeline-wrap"><div class="timeline-axis"><span>9am</span><span>11am</span><span>1pm</span><span>3pm</span><span>5pm</span></div><div id="tl-rows"></div></div><div class="status-line" id="greedy-status"><span class="dot"></span><span id="greedy-status-text">Ready</span></div>`;
  const meetings=[
    {name:'Design Sync', s:9, e:10.5},{name:'1:1 w/ Sam', s:9.5, e:11},{name:'Sprint Planning', s:10.5, e:12},
    {name:'Lunch & Learn', s:12, e:13},{name:'Client Call', s:12.5, e:14},{name:'Budget Review', s:13.5, e:15},
    {name:'Retro', s:15, e:16},{name:'Interview', s:14, e:15.5},
  ];
  const sorted=[...meetings].sort((a,b)=>a.e-b.e);
  const frames=[]; let lastEnd=-Infinity; const chosen=[]; const states=sorted.map(()=>'pending');
  frames.push({states:[...states],considering:-1,chosen:[]});
  sorted.forEach((m,idx)=>{
    states[idx]='considering'; frames.push({states:[...states],considering:idx,chosen:[...chosen]});
    if(m.s>=lastEnd){ states[idx]='chosen'; chosen.push(idx); lastEnd=m.e; }
    else { states[idx]='rejected'; }
    frames.push({states:[...states],considering:-1,chosen:[...chosen]});
  });
  frames.push({states:[...states],considering:-1,chosen:[...chosen],done:true});

  const min=9, max=17;
  const rowsEl=document.getElementById('tl-rows');
  rowsEl.innerHTML = sorted.map((m,idx)=>`<div class="tl-row"><div class="tl-bar" id="tl-${idx}" style="left:${((m.s-min)/(max-min))*100}%;width:${((m.e-m.s)/(max-min))*100}%">${m.name}</div></div>`).join('');
  const render=(f)=>{
    sorted.forEach((m,idx)=>{
      const el=document.getElementById('tl-'+idx);
      el.className='tl-bar'+(f.states[idx]==='chosen'?' chosen':f.states[idx]==='rejected'?' rejected':f.states[idx]==='considering'?' considering':'');
    });
    const t=document.getElementById('greedy-status-text');
    if(f.done) t.textContent = `Booked ${f.chosen.length} of ${sorted.length} meetings into the room ✅`;
    else if(f.considering>=0){ const m=sorted[f.considering]; t.textContent = `Considering "${m.name}" (ends earliest among remaining) — does it start after the last booked meeting ends?`; }
    else t.textContent='Sorting meetings by end time…';
  };
  player={frames,idx:0,timer:null,speed:750,render}; render(frames[0]);
}

/* ====================== 9. STRINGS (pattern search) ====================== */
function initString(){
  document.getElementById('demo-toolbar').innerHTML = `
    <span class="field-label">Find</span><input type="text" id="str-pattern" value="over" maxlength="10">
    <button class="ctl-btn primary" onclick="runString()">🔎 Search</button>` + playerBar();
  document.getElementById('canvas-body').innerHTML = `<div class="text-wrap" id="text-wrap"></div><div class="status-line" id="str-status"><span class="dot"></span><span id="str-status-text">Ready</span></div>`;
  runString();
}
function runString(){
  const text='the quick brown fox jumps over the lazy dog while a clever fox watches over the yard';
  const pattern=(document.getElementById('str-pattern').value||'over').toLowerCase();
  const frames=[]; let foundAt=-1;
  for(let i=0;i<=text.length-pattern.length;i++){
    let j=0;
    while(j<pattern.length && text[i+j]===pattern[j]){
      frames.push({i,matchLen:j+1,mismatchAt:-1});
      j++;
    }
    if(j===pattern.length){ foundAt=i; frames.push({i,matchLen:pattern.length,mismatchAt:-1,found:true}); break; }
    else frames.push({i,matchLen:j,mismatchAt:j});
  }
  if(foundAt===-1) frames.push({i:-1,matchLen:0,mismatchAt:-1,notFound:true});
  const wrap=document.getElementById('text-wrap');
  const render=(f)=>{
    let html='';
    for(let k=0;k<text.length;k++){
      let cls='ch'; const rel=k-f.i;
      if(f.i>=0 && rel>=0 && rel<pattern.length){
        if(f.found) cls+=' found';
        else if(rel<f.matchLen) cls+=' match';
        else if(rel===f.mismatchAt) cls+=' mismatch';
        else cls+=' window';
      }
      html+=`<span class="${cls}">${text[k]===' '?'&nbsp;':text[k]}</span>`;
    }
    wrap.innerHTML=html;
    const t=document.getElementById('str-status-text');
    if(f.found) t.textContent=`Match found at character ${f.i} ✅`;
    else if(f.notFound) t.textContent=`"${pattern}" was not found in the document`;
    else if(f.mismatchAt>=0) t.textContent=`Mismatch at offset ${f.i} — sliding the window one character right`;
    else t.textContent=`Checking offset ${f.i}: ${f.matchLen}/${pattern.length} characters matched so far`;
  };
  player={frames,idx:0,timer:null,speed:120,render}; render(frames[0]);
}

/* ====================== 10. SIEVE OF ERATOSTHENES ====================== */
function initSieve(){
  document.getElementById('demo-toolbar').innerHTML = playerBar();
  document.getElementById('canvas-body').innerHTML = `<div class="num-grid" id="num-grid"></div><div class="status-line" id="sieve-status"><span class="dot"></span><span id="sieve-status-text">Ready</span></div>`;
  const N=100;
  const composite=Array(N+1).fill(false);
  const frames=[]; frames.push({composite:[...composite],p:-1,marking:-1});
  for(let p=2;p*p<=N;p++){
    if(composite[p]) continue;
    frames.push({composite:[...composite],p,marking:-1,checking:true});
    for(let m=p*p;m<=N;m+=p){
      composite[m]=true;
      frames.push({composite:[...composite],p,marking:m});
    }
  }
  frames.push({composite:[...composite],p:-1,marking:-1,final:true});
  const grid=document.getElementById('num-grid');
  const render=(f)=>{
    let html='';
    for(let n=1;n<=N;n++){
      let cls='num-cell';
      if(n===1) cls+=''; else if(n===f.marking) cls+=' marking';
      else if(f.composite[n]) cls+=' composite';
      else if(n>=2 && f.final) cls+=' prime';
      else if(n===f.p) cls+=' prime-candidate';
      html+=`<div class="${cls}">${n}</div>`;
    }
    grid.innerHTML=html;
    const t=document.getElementById('sieve-status-text');
    if(f.final) t.textContent='Every surviving number (green) is prime ✅';
    else if(f.marking>0) t.textContent=`Crossing out ${f.marking} — it's a multiple of ${f.p}`;
    else if(f.checking) t.textContent=`${f.p} survived so far — it must be prime. Crossing out its multiples…`;
    else t.textContent='Starting from 2…';
  };
  player={frames,idx:0,timer:null,speed:20,render}; render(frames[0]);
}
