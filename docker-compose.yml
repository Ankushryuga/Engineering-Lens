services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: engineering-lens-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: engineering-lens-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Host-side port remapped to 29094 to avoid colliding with unrelated
      # containers on this machine that already publish 9092. Only needed
      # for connecting to Kafka from the Windows host (e.g. running the API
      # or a sandbox worker outside Docker); containers on the compose
      # network always use "kafka:9092" internally, unaffected by this.
      - "29094:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - default
      - sandbox

  redis:
    image: redis:7.2-alpine
    container_name: engineering-lens-redis
    ports:
      # Host-side port remapped to 6380 to avoid colliding with unrelated
      # containers on this machine that already publish 6379. Containers on
      # the compose network always use "redis:6379" internally.
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: engineering-lens-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-algo_visualizer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./catalog/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./catalog/seeds/algorithms.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-algo} -d ${POSTGRES_DB:-algo_visualizer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-migrate:
    image: postgres:16-alpine
    container_name: engineering-lens-catalog-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-algo_secret}
    volumes:
      - ./catalog/migrations:/migrations:ro
    command:
      - sh
      - -c
      - >-
        psql -v ON_ERROR_STOP=1
        -h postgres
        -U ${POSTGRES_USER:-algo}
        -d ${POSTGRES_DB:-algo_visualizer}
        -f /migrations/008_pathfinding_grid_lessons.sql &&
        psql -v ON_ERROR_STOP=1
        -h postgres
        -U ${POSTGRES_USER:-algo}
        -d ${POSTGRES_DB:-algo_visualizer}
        -f /migrations/013_python_go_catalog.sql
    restart: "no"

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: engineering-lens-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-algo}:${POSTGRES_PASSWORD:-algo_secret}@postgres:5432/${POSTGRES_DB:-algo_visualizer}?sslmode=disable"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOBS_TOPIC: visualize-jobs
      KAFKA_RESULTS_TOPIC: visualize-results
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      RATE_LIMIT_RPS: "10"
      JOB_TIMEOUT_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Sandbox Workers ──────────────────────────────────────────────────────────
  sandbox-python:
    build:
      context: ./sandbox/python
      dockerfile: Dockerfile
    container_name: engineering-lens-sandbox-python
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOBS_TOPIC: visualize-jobs
      KAFKA_RESULTS_TOPIC: visualize-results
      KAFKA_GROUP_ID: sandbox-python
      LANGUAGE_FILTER: python
      MAX_EXEC_SECONDS: "10"
      MAX_MEMORY_MB: "128"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 160m
    cpus: "0.75"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox

  sandbox-go:
    build:
      context: ./sandbox/golang
      dockerfile: Dockerfile
    container_name: engineering-lens-sandbox-go
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_JOBS_TOPIC: visualize-jobs
      KAFKA_RESULTS_TOPIC: visualize-results
      KAFKA_GROUP_ID: sandbox-go
      LANGUAGE_FILTER: go
      MAX_EXEC_SECONDS: "20"
      MAX_MEMORY_MB: "384"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    read_only: true
    tmpfs:
      # Student source/caches remain non-executable. Go's final compiled binary
      # gets a separate, tightly scoped executable tmpfs.
      - /tmp:rw,noexec,nosuid,nodev,size=192m,mode=1777
      - /go-exec:rw,exec,nosuid,nodev,size=96m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    networks:
      - sandbox

  # ── Frontend (dev) ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: engineering-lens-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/usr/src/frontend/src
    environment:
      # Inside the frontend container, "localhost" refers to the container
      # itself, not the API service — must use the Docker Compose service
      # name "api" so the Vite dev-server proxy can actually reach it.
      VITE_API_URL: http://api:8080
      VITE_WS_URL: ws://api:8080
    depends_on:
      - api

networks:
  sandbox:
    internal: true

volumes:
  postgres_data:
